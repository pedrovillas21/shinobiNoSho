<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Criação · Editar Versatilidade no celular</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#16120e}
a{color:#f0892a}a:hover{color:#ffd3a8}
button,input{font:inherit}
button{cursor:pointer}
.nosb{scrollbar-width:none}.nosb::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #16120e; color: #efe6d6; font-family: 'Zen Kaku Gothic New', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="flex-shrink: 0; border-bottom: 1px solid #2e261e">
    <div style="display: flex; align-items: center; gap: 10px; padding: 8px 16px">
      <a href="PoderesMobile.dc.html" aria-label="Voltar para a lista de poderes" style="display: grid; place-items: center; width: 44px; height: 44px; border: 1px solid #3a3027; border-radius: 12px; color: #efe6d6">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
      </a>
      <div style="display: flex; flex-direction: column; flex: 1; min-width: 0">
        <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.12em; color: #b3a48c">VERSATILIDADE · {{ nthUp }}</span>
        <span style="font-family: 'Shippori Mincho B1', Georgia, serif; font-weight: 800; font-size: 18px; color: #f3e9d6; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ title }}</span>
      </div>
      <div role="group" aria-label="Nível da Versatilidade" style="display: flex; align-items: center; padding: 2px; border: 1px solid #3a3027; border-radius: 12px; background: #1b1612">
        <button type="button" aria-label="Diminuir nível" style="width: 32px; height: 38px; border: 0; background: transparent; color: #efe6d6; font-weight: 700">−</button>
        <span style="font-size: 13px; font-weight: 700; color: #f0892a; white-space: nowrap">Nv 10</span>
        <button type="button" aria-label="Aumentar nível" style="width: 32px; height: 38px; border: 0; background: transparent; color: #efe6d6; font-weight: 700">+</button>
      </div>
    </div>
    <div class="nosb" style="display: flex; gap: 6px; padding: 0 16px 10px; overflow-x: auto">
      <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="4">
        <button type="button" onClick="{{ t.pick }}" aria-pressed="{{ t.pressed }}" style="flex-shrink: 0; display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 99px; border: 1px solid {{ t.border }}; background: {{ t.bg }}; color: {{ t.color }}; font-size: 13px; font-weight: 700; white-space: nowrap">
          {{ t.nth }}
          <sc-for list="{{ t.ks }}" as="k" hint-placeholder-count="2">
            <span style="color: {{ k.c }}">{{ k.kanji }}</span>
          </sc-for>
        </button>
      </sc-for>
    </div>
  </header>

  <main style="flex: 1; min-height: 0; overflow: hidden; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #b3a48c">
      <span>Dano <strong style="color: #f3e9d6">20</strong></span><span style="color: #3a3027">·</span>
      <span>Dif <strong style="color: #f3e9d6">29</strong></span><span style="color: #3a3027">·</span>
      <span>Custo até <strong style="color: #f3e9d6">10 PC</strong></span>
      <span style="margin-left: auto; color: {{ ruleColor }}">{{ ruleText }}</span>
    </div>
    <div style="display: flex; gap: 3px" aria-hidden="true">
      <sc-for list="{{ seq }}" as="sq" hint-placeholder-count="10">
        <span style="flex: 1; display: grid; place-items: center; height: 22px; border-radius: 6px; background: {{ sq.bg }}; color: {{ sq.color }}; font-size: 12px; font-weight: 800">{{ sq.label }}</span>
      </sc-for>
    </div>

    <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border: 1px solid #2e261e; border-radius: 14px; background: #211b15; overflow: hidden">
      <sc-for list="{{ rows }}" as="r" hint-placeholder-count="10">
        <li style="display: flex; align-items: center; gap: 10px; height: 54px; padding: 0 8px 0 12px; border-bottom: 1px solid #2e261e">
          <span style="width: 26px; flex-shrink: 0; font-size: 14px; font-weight: 700; color: #f0892a">{{ r.lv }}º</span>
          <sc-if value="{{ r.all }}" hint-placeholder-val="{{ false }}">
            <span style="flex-shrink: 0; display: grid; place-items: center; width: {{ segW }}; height: 34px; border-radius: 9px; background: #2a221a; font-size: 11px; font-weight: 700; color: #b3a48c">todos</span>
          </sc-if>
          <sc-if value="{{ r.some }}" hint-placeholder-val="{{ true }}">
            <span role="group" aria-label="{{ r.segAria }}" style="flex-shrink: 0; display: flex; padding: 2px; gap: 2px; border-radius: 10px; background: #1b1612; border: 1px solid #3a3027">
              <sc-for list="{{ r.segs }}" as="sg" hint-placeholder-count="2">
                <button type="button" onClick="{{ sg.pick }}" aria-pressed="{{ sg.pressed }}" aria-label="{{ sg.aria }}" style="width: 34px; height: 30px; border: 0; border-radius: 8px; background: {{ sg.bg }}; color: {{ sg.color }}; font-family: 'Shippori Mincho B1', Georgia, serif; font-size: 15px; font-weight: 800">{{ sg.kanji }}</button>
              </sc-for>
            </span>
          </sc-if>
          <button type="button" aria-label="{{ r.aria }}" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; height: 48px; padding: 0; border: 0; background: transparent; color: #efe6d6; text-align: left">
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
              <span style="display: flex; align-items: center; gap: 6px; min-width: 0">
                <span style="font-size: 14px; font-weight: 700; color: {{ r.effColor }}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ r.eff }}</span>
                <sc-if value="{{ r.evo }}" hint-placeholder-val="{{ false }}">
                  <span style="flex-shrink: 0; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 99px; background: rgba(127,176,105,0.18); color: #9fd08a">evolução</span>
                </sc-if>
              </span>
              <span style="font-size: 12px; color: #8f8170; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ r.tech }}</span>
            </span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8f8170" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
          </button>
        </li>
      </sc-for>
    </ol>
  </main>

  <div style="flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 12px 14px; border-top: 1px solid #2e261e; background: #1b1612">
    <a href="PoderesMobile.dc.html" style="flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 48px; border: 1px solid #3a3027; border-radius: 12px; color: #efe6d6; font-size: 14px; font-weight: 700; text-decoration: none">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
      Poderes
    </a>
    <button type="button" onClick="{{ next }}" style="flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 48px; border: 0; border-radius: 12px; background: #c2381b; color: #fff; font-size: 14px; font-weight: 700">{{ nextLabel }}
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var EL = {
  R: { name: 'Raiton', kanji: '雷', c: '#e8c547' },
  K: { name: 'Katon', kanji: '火', c: '#f07a4a' },
  W: { name: 'Fuuton', kanji: '風', c: '#7fc8a9' },
  S: { name: 'Suiton', kanji: '水', c: '#5aa7e0' },
  D: { name: 'Doton', kanji: '土', c: '#c99a66' },
  F: { name: 'Fuuinjutsu', kanji: '封', c: '#b294e8' }
};
function rgba(hex, a) {
  var n = parseInt(hex.slice(1), 16);
  return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
}
var POWERS = [
  { nth: '1ª compra', cols: ['R', 'F'], rows: [
    [1, '*', 'Canhão · Fuuinjutsu 1', 'Jinraisen · Selo de Armazenamento'],
    [2, 'R', 'Raio', 'Shiden'], [3, 'F', 'Fuuinjutsu 3', 'Misshi / Nise no Shitai'], [4, 'R', 'Lâmina de Raios', 'Chidori'],
    [5, 'R', 'Arma Elétrica', 'Raiken'], [6, 'F', 'Fuuinjutsu 6', 'Ninjutsu no Wana'], [7, 'F', 'Fuuinjutsu 7', 'Chakra no Souin'],
    [8, 'R', 'Kirin (homebrew)', 'Kirin'], [9, 'R', 'Lâmina de Raios Nv 9', 'Raikiri', true], [10, 'F', 'Fuuinjutsu 10', 'Keiyaku Fuuin']
  ] },
  { nth: '2ª compra', cols: ['K', 'W'], rows: [
    [1, '*', 'Canhão · Canhão', 'Hiakahou · Renkūdan'],
    [2, 'K', 'Orbe', 'Shoukakyuu no Jutsu'], [3, 'W', 'Barreira', 'Fūhakujun'], [4, 'K', 'Flechas', 'Housenka no Jutsu'],
    [5, 'K', 'Ricochete', ''], [6, 'W', 'Rasengan', 'Rasengan'], [7, 'K', 'Coluna', 'Kaen Senpū'],
    [8, 'W', 'Onda Explosiva', 'Shinkuuha'], [9, 'K', 'Flechas Nv 9', 'Housenka Tsumabeni', true], [10, 'K', 'Meteoros', 'Homuranagase']
  ] },
  { nth: '3ª compra', cols: ['S', 'D'], rows: [
    [1, '*', 'Canhão · Canhão', 'Mizudeppou · Makigai Hō'],
    [2, 'D', 'Criar Arma', 'Buki no Sakusei'], [3, 'S', 'Barreira', 'Haran Banshō'], [4, 'D', 'Imergir', 'Moguragakure no Jutsu'],
    [5, 'D', 'Tremor', 'Kiretsu'], [6, 'S', 'Restringente', 'Araumi'], [7, 'S', 'Lança', 'Ryūsuisō'],
    [8, 'D', 'Algemar', 'Sazareishi'], [9, 'S', 'Prisão de Água', 'Suirou no Jutsu'], [10, 'S', 'Colisão de Ondas', 'Suishouha']
  ] },
  { nth: '4ª compra', cols: ['R', 'W', 'D'], rows: [
    [1, '*', 'Canhão ×3', 'Jinraisen · Renkūdan · Makigai Hō'],
    [2, 'R', 'Raio', 'Shiden'], [3, 'D', 'Barreira', 'Dorou Doumu'], [4, 'R', 'Flechas', 'Kanden Haribari'],
    [5, 'W', 'Correnteza', 'Taifuuikka'], [6, 'R', 'Descarga', 'Chidori Nagashi'], [7, 'W', 'Nuvem', 'Kumo'],
    [8, 'R', 'Arma Elétrica Nv 8', 'Raiken', true], [9, 'R', 'Desastre', ''], [10, 'W', 'Rasengan Nv 10', 'Oodama Rasengan', true]
  ] }
];
class Component extends DCLogic {
  state = { sel: 0, own: {} };
  renderVals() {
    var self = this;
    var st = this.state;
    var p = POWERS[st.sel];
    var ownerOf = function (r) { var k = st.sel + ':' + r[0]; return st.own[k] || r[1]; };
    var owners = p.rows.map(ownerOf);
    // Regra: no máximo 2 níveis seguidos no mesmo poder (do 2º nível em diante).
    var broken = owners.some(function (o, i) { return i >= 3 && o !== '*' && o === owners[i - 1] && o === owners[i - 2]; });
    return {
      nthUp: p.nth.toUpperCase(),
      title: p.cols.map(function (k) { return EL[k].name; }).join(' + '),
      segW: (p.cols.length * 36 + 6) + 'px',
      ruleText: broken ? '3 seguidos no mesmo' : 'ordem ok',
      ruleColor: broken ? '#e0573a' : '#7fb069',
      nextLabel: st.sel < POWERS.length - 1 ? POWERS[st.sel + 1].nth : 'Concluir',
      next: function () { self.setState({ sel: Math.min(POWERS.length - 1, self.state.sel + 1) }); },
      tabs: POWERS.map(function (pw, i) {
        var on = i === st.sel;
        return {
          nth: pw.nth.replace(' compra', ''), pressed: on ? 'true' : 'false',
          bg: on ? '#2a221a' : 'transparent', border: on ? '#f0892a' : '#3a3027', color: on ? '#f3e9d6' : '#b3a48c',
          ks: pw.cols.map(function (k) { return { kanji: EL[k].kanji, c: EL[k].c }; }),
          pick: function () { self.setState({ sel: i }); }
        };
      }),
      seq: owners.map(function (o) {
        var c = o === '*' ? '#8f8170' : EL[o].c;
        return { label: o === '*' ? '∗' : EL[o].kanji, bg: rgba(c, 0.18), color: c };
      }),
      rows: p.rows.map(function (r) {
        var o = ownerOf(r);
        var changed = o !== r[1];
        var all = r[1] === '*';
        return {
          lv: r[0], all: all, some: !all, evo: !changed && !!r[4],
          eff: changed ? 'Escolher efeito de ' + EL[o].name + '…' : r[2],
          effColor: changed ? '#f0892a' : '#f3e9d6',
          tech: changed ? 'toque para escolher' : (r[3] || 'sem nome de técnica'),
          aria: 'Escolher efeito e nome da técnica do nível ' + r[0],
          segAria: 'Poder versátil do nível ' + r[0],
          segs: p.cols.map(function (k) {
            var on = o === k;
            return {
              kanji: EL[k].kanji, pressed: on ? 'true' : 'false', aria: EL[k].name,
              bg: on ? rgba(EL[k].c, 0.25) : 'transparent', color: on ? EL[k].c : '#5e5246',
              pick: function () { var m = Object.assign({}, self.state.own); m[self.state.sel + ':' + r[0]] = k; self.setState({ own: m }); }
            };
          })
        };
      })
    };
  }
}
</script>
</body>
</html>
