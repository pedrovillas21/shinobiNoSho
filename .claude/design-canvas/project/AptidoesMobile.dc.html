<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Criação · Aptidões no celular</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#16120e}
a{color:#f0892a}a:hover{color:#ffd3a8}
button,input{font:inherit}
button{cursor:pointer}
.nosb{scrollbar-width:none}.nosb::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #16120e; color: #efe6d6; font-family: 'Zen Kaku Gothic New', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="flex-shrink: 0; border-bottom: 1px solid #2e261e">
    <div style="display: flex; align-items: center; gap: 10px; padding: 8px 16px">
      <a href="#" aria-label="Voltar às fichas" style="display: grid; place-items: center; width: 44px; height: 44px; border: 1px solid #3a3027; border-radius: 12px; color: #efe6d6">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
      </a>
      <div style="display: flex; flex-direction: column; flex: 1; min-width: 0">
        <span style="font-family: 'Shippori Mincho B1', Georgia, serif; font-weight: 800; font-size: 18px; color: #f3e9d6; line-height: 1.15">Ashihira Senju</span>
        <span style="font-size: 12px; color: #b3a48c">Sannin/Kage · salva na conta</span>
      </div>
      <div role="group" aria-label="Nível de campanha" style="display: flex; align-items: center; padding: 2px; border: 1px solid #3a3027; border-radius: 12px; background: #1b1612">
        <button type="button" aria-label="Diminuir NC" style="width: 34px; height: 38px; border: 0; background: transparent; color: #efe6d6; font-weight: 700">−</button>
        <span style="font-size: 13px; font-weight: 700; white-space: nowrap">NC 20</span>
        <button type="button" aria-label="Aumentar NC" style="width: 34px; height: 38px; border: 0; background: transparent; color: #efe6d6; font-weight: 700">+</button>
      </div>
    </div>
    <button type="button" aria-label="Ver todas as etapas e orçamentos" style="width: 100%; display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 16px; border: 0; border-top: 1px solid #2e261e; background: #1b1612; color: #efe6d6; text-align: left">
      <span style="display: flex; flex-direction: column; gap: 5px; flex: 1">
        <span style="font-size: 13px; font-weight: 700">Etapa 5 de 9 · <span style="color: #f3e9d6">Aptidões</span></span>
        <span style="display: flex; gap: 3px">
          <sc-for list="{{ segs }}" as="sg" hint-placeholder-count="9">
            <span style="flex: 1; height: 3px; border-radius: 3px; background: {{ sg.c }}"></span>
          </sc-for>
        </span>
      </span>
      <span style="font-size: 13px; font-weight: 700; color: #7fb069; white-space: nowrap">0/3 grátis</span>
      <span style="font-size: 11px; color: #8f8170">▾</span>
    </button>
  </header>

  <main style="flex: 1; min-height: 0; overflow: hidden; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 10px">
      <div style="display: flex; flex-direction: column; flex: 1">
        <h1 style="margin: 0; font-family: 'Shippori Mincho B1', Georgia, serif; font-weight: 800; font-size: 26px; color: #f3e9d6">Aptidões</h1>
        <span style="font-size: 13px; color: #b3a48c">17 aptidões · 24 pontos de poder</span>
      </div>
      <button type="button" onClick="{{ openCat }}" aria-expanded="{{ catExpanded }}" style="display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0 14px; border: 0; border-radius: 12px; background: #c2381b; color: #fff; font-size: 14px; font-weight: 700">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        Adicionar
      </button>
    </div>
    <label style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px; border: 1px solid #3a3027; border-radius: 12px; background: #1b1612">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#b3a48c" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Filtrar suas aptidões</span>
      <input type="text" placeholder="Filtrar suas aptidões" value="{{ q }}" onChange="{{ onQ }}" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; color: #efe6d6; font-size: 15px">
    </label>

    <div style="display: flex; flex-direction: column; border: 1px solid #2e261e; border-radius: 14px; background: #211b15; overflow: hidden">
      <sc-for list="{{ groups }}" as="g" hint-placeholder-count="5">
        <div>
          <button type="button" onClick="{{ g.toggle }}" aria-expanded="{{ g.expanded }}" style="width: 100%; display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px; border: 0; border-bottom: 1px solid #2e261e; background: #1b1612; color: #efe6d6; text-align: left">
            <span style="width: 12px; font-size: 11px; color: #8f8170">{{ g.chev }}</span>
            <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #b3a48c">{{ g.label }}</span>
            <span style="font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 99px; background: #2a221a; color: #b3a48c">{{ g.n }}</span>
            <span style="margin-left: auto; font-size: 12px; color: #8f8170; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 170px">{{ g.peek }}</span>
          </button>
          <sc-if value="{{ g.open }}" hint-placeholder-val="{{ true }}">
            <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="4">
              <button type="button" aria-label="{{ it.aria }}" style="width: 100%; display: flex; align-items: center; gap: 10px; min-height: 50px; padding: 6px 14px; border: 0; border-bottom: 1px solid #2e261e; background: transparent; color: #efe6d6; text-align: left">
                <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
                  <span style="font-size: 14px; font-weight: 700; color: #f3e9d6">{{ it.name }}</span>
                  <span style="font-size: 12px; color: #8f8170; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ it.desc }}</span>
                </span>
                <span style="flex-shrink: 0; font-size: 12px; font-weight: 700; color: {{ it.costColor }}">{{ it.cost }}</span>
              </button>
            </sc-for>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </main>

  <div style="flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 12px 14px; border-top: 1px solid #2e261e; background: #1b1612">
    <a href="#" aria-label="Voltar para Perícias" style="display: grid; place-items: center; width: 48px; height: 48px; border: 1px solid #3a3027; border-radius: 12px; color: #efe6d6">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <button type="button" style="flex: 1; height: 48px; border: 1px solid #3a3027; border-radius: 12px; background: transparent; color: #efe6d6; font-size: 14px; font-weight: 700">Resumo</button>
    <a href="PoderesMobile.dc.html" style="flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 48px; border-radius: 12px; background: #c2381b; color: #fff; font-size: 14px; font-weight: 700; text-decoration: none">Poderes
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
    </a>
  </div>

  <sc-if value="{{ catOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; background: rgba(10,8,6,0.6)">
      <section aria-label="Catálogo de aptidões" style="max-height: 640px; display: flex; flex-direction: column; gap: 10px; padding: 8px 16px 16px; border-radius: 20px 20px 0 0; background: #1b1612; border-top: 1px solid #3a3027">
        <span style="align-self: center; width: 40px; height: 4px; border-radius: 4px; background: #3a3027"></span>
        <div style="display: flex; align-items: center; justify-content: space-between">
          <h2 style="margin: 0; font-family: 'Shippori Mincho B1', Georgia, serif; font-weight: 800; font-size: 20px; color: #f3e9d6">Adicionar aptidão</h2>
          <button type="button" onClick="{{ closeCat }}" aria-label="Fechar catálogo" style="display: grid; place-items: center; width: 44px; height: 44px; border: 1px solid #3a3027; border-radius: 12px; background: transparent; color: #efe6d6">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
          </button>
        </div>
        <label style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px; border: 1px solid #3a3027; border-radius: 12px; background: #16120e">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#b3a48c" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
          <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Buscar no catálogo</span>
          <input type="text" placeholder="Buscar nome ou pré-requisito" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; color: #efe6d6; font-size: 15px">
        </label>
        <div class="nosb" style="display: flex; gap: 6px; overflow-x: auto">
          <sc-for list="{{ catChips }}" as="cc" hint-placeholder-count="2">
            <button type="button" onClick="{{ cc.pick }}" aria-pressed="{{ cc.pressed }}" style="flex-shrink: 0; display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 99px; border: 1px solid {{ cc.border }}; background: {{ cc.bg }}; color: {{ cc.color }}; font-size: 13px; font-weight: 700">{{ cc.label }} <span style="font-weight: 500; opacity: 0.75">{{ cc.n }}</span></button>
          </sc-for>
        </div>
        <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; overflow: hidden">
          <sc-for list="{{ catalog }}" as="ca" hint-placeholder-count="8">
            <li style="display: flex; align-items: center; gap: 10px; padding: 6px 6px 6px 12px; border: 1px solid #2e261e; border-radius: 12px; background: #211b15">
              <span style="display: flex; flex-direction: column; gap: 1px; flex: 1; min-width: 0">
                <span style="font-size: 14px; font-weight: 700; color: #f3e9d6">{{ ca.name }}</span>
                <span style="font-size: 12px; color: {{ ca.reqColor }}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ ca.mark }} {{ ca.req }}</span>
              </span>
              <button type="button" aria-label="{{ ca.aria }}" style="display: grid; place-items: center; width: 44px; height: 44px; flex-shrink: 0; border: 0; border-radius: 10px; background: {{ ca.btnBg }}; color: #fff">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
              </button>
            </li>
          </sc-for>
        </ul>
      </section>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var OWNED = [
  ['combate', 'Acuidade', 'Combate Corporal com Destreza', 'Grátis'],
  ['combate', 'Maestria', '+1 de precisão numa técnica', 'Grátis'],
  ['combate', 'Saque Rápido', 'Sacar arma como ação livre', 'Grátis'],
  ['combate', 'Ataque em Movimento', 'Mover antes e depois de atacar', '2 pts'],
  ['combate', 'Ponto Cego', 'Finta como ação de movimento', '2 pts'],
  ['tecnica', 'Técnica Avançada', 'Potencializar NC 8 · Técnica Poderosa NC 12', '2 pts'],
  ['tecnica', 'Potencializar', 'META · alcance/área ×2 ou +1 de dano', 'incluída'],
  ['tecnica', 'Técnica Poderosa', 'META · +0,5 no grau de dano', 'incluída'],
  ['tecnica', 'Talento Natural', 'Katon · Sopro Destrutivo', '2 pts'],
  ['tensai', 'Controle Perfeito Nv 1', 'Espírito vira Inteligência', '2 pts'],
  ['tensai', 'Controle Perfeito Nv 2', '+Inteligência no chakra', '2 pts'],
  ['tensai', 'Deus do Trovão Voador', 'Hiraishin · 30 kunais marcadas', '2 pts'],
  ['elemento', 'Domínio do Raio', 'Crítico aprimorado em Raiton', '2 pts'],
  ['clones', 'Sensor', '5 PC · alcance 10 + 2×Rastrear', '2 pts'],
  ['clones', 'Clone', 'Clones como parceiro', '2 pts'],
  ['clones', 'Clone Nv 2', 'Clones como parceiro', '2 pts'],
  ['clones', 'Clone Verdadeiro', 'Clones como parceiro', '2 pts']
];
var GROUPS = [['combate', 'Combate'], ['tecnica', 'Técnica'], ['tensai', 'Tensai'], ['elemento', 'Elemento'], ['clones', 'Sentidos e clones']];
var CATALOG = [
  ['Ambidestria', 'Combate Corporal 12 ou à Distância 12', true],
  ['Arremessador Eficiente', 'Combate à Distância 8', true],
  ['Atirador', 'Destreza 12', true],
  ['Avaliador do Perigo', 'Inteligência ou Percepção 4', true],
  ['Combate Defensivo', 'Combate Corporal 9', true],
  ['Crítico Aprimorado', 'falta Especialista', false],
  ['Dano Extra', 'Combate 18', true],
  ['Mestre dos Selos', 'Prestidigitação 12 (tem 11)', false],
  ['Mobilidade', 'falta Reflexos', false],
  ['Reflexos', 'sem pré-requisito', true],
  ['Retirada Rápida', 'Agilidade 9', true],
  ['Tiro Longo', 'Destreza 11', true]
];
class Component extends DCLogic {
  state = { q: '', closed: { tensai: true, elemento: true, clones: true }, cat: false, catFilter: 'disp' };
  renderVals() {
    var self = this;
    var st = this.state;
    var q = (st.q || '').toLowerCase().trim();
    var catalog = CATALOG.filter(function (c) { return st.catFilter === 'todas' || c[2]; }).slice(0, 8);
    return {
      q: st.q,
      onQ: function (e) { self.setState({ q: e.target.value }); },
      segs: [1, 2, 3, 4, 5, 6, 7, 8, 9].map(function (i) { return { c: i < 5 ? '#7fb069' : i === 5 ? '#f0892a' : '#3a3027' }; }),
      catOpen: st.cat,
      catExpanded: st.cat ? 'true' : 'false',
      openCat: function () { self.setState({ cat: true }); },
      closeCat: function () { self.setState({ cat: false }); },
      groups: GROUPS.map(function (g) {
        var items = OWNED.filter(function (o) { return o[0] === g[0] && (!q || (o[1] + ' ' + o[2]).toLowerCase().indexOf(q) >= 0); });
        var open = q ? true : !st.closed[g[0]];
        return {
          label: g[1], n: items.length, open: open, expanded: open ? 'true' : 'false', chev: open ? '▾' : '▸',
          peek: open ? '' : items.map(function (o) { return o[1]; }).join(', '),
          toggle: function () { var c = Object.assign({}, self.state.closed); c[g[0]] = !c[g[0]]; self.setState({ closed: c }); },
          items: items.map(function (o) {
            return { name: o[1], desc: o[2], cost: o[3], aria: 'Ver detalhes de ' + o[1], costColor: o[3] === 'Grátis' ? '#7fb069' : o[3] === 'incluída' ? '#8f8170' : '#efe6d6' };
          })
        };
      }).filter(function (g) { return g.n > 0; }),
      catChips: [['disp', 'Disponíveis', CATALOG.filter(function (c) { return c[2]; }).length], ['todas', 'Todas', CATALOG.length]].map(function (c) {
        var on = st.catFilter === c[0];
        return { label: c[1], n: c[2], pressed: on ? 'true' : 'false', bg: on ? '#f3e9d6' : 'transparent', color: on ? '#231b13' : '#efe6d6', border: on ? '#f3e9d6' : '#3a3027', pick: function () { self.setState({ catFilter: c[0] }); } };
      }),
      catalog: catalog.map(function (c) {
        return { name: c[0], req: c[1], mark: c[2] ? '✓' : '✗', reqColor: c[2] ? '#7fb069' : '#e0573a', btnBg: c[2] ? '#c2381b' : '#3a3027', aria: 'Adicionar ' + c[0] };
      })
    };
  }
}
</script>
</body>
</html>
