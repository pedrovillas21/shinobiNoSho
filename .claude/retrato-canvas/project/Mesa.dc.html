<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Mesa · Cabeçalho com retrato</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#16120e}
a{color:#f0892a}a:hover{color:#ffd3a8}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 620px; box-sizing: border-box; background: #16120e; color: #efe6d6; font-family: 'Zen Kaku Gothic New', system-ui, sans-serif">
  <header style="border-bottom: 1px solid #2e261e; background: #16120e">
    <div style="max-width: 1280px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding: 12px 32px">
      <a href="#" aria-label="Voltar ao início" style="display: grid; place-items: center; width: 44px; height: 44px; flex-shrink: 0; border: 1px solid #3a3027; border-radius: 12px; color: #efe6d6">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
      </a>

      <button type="button" onClick="{{ toggle }}" aria-expanded="{{ open }}" aria-label="Ver retrato" style="position: relative; flex-shrink: 0; width: 52px; height: 52px; padding: 0; border: 2px solid {{ ring }}; border-radius: 14px; background: #2a221a">
        <span style="display: block; width: 48px; height: 48px; border-radius: 12px; overflow: hidden">
          <svg viewBox="12 24 96 96" width="48" height="48" aria-hidden="true" style="display: block"><rect width="120" height="160" fill="#2a221a"></rect><circle cx="92" cy="34" r="30" fill="#c2381b" opacity="0.45"></circle><path d="M6 160 C10 122 32 108 60 108 C88 108 110 122 114 160 Z" fill="#0f0c09"></path><path d="M30 64 L26 40 L40 50 L44 28 L54 44 L62 24 L68 44 L80 30 L80 50 L94 42 L88 66 Z" fill="#0f0c09"></path><circle cx="60" cy="72" r="26" fill="#0f0c09"></circle><rect x="33" y="56" width="54" height="11" rx="2" fill="#5b4a36"></rect><rect x="49" y="57" width="22" height="9" rx="1.5" fill="#b3a48c"></rect></svg>
        </span>
        <span style="position: absolute; right: -7px; bottom: -7px; display: grid; place-items: center; width: 22px; height: 22px; border-radius: 99px; border: 2px solid #16120e; background: #c2381b; font-family: 'Shippori Mincho B1', Georgia, serif; font-size: 12px; font-weight: 800; color: #fff">千</span>
      </button>

      <div style="display: flex; flex-direction: column; flex: 1; min-width: 0; line-height: 1.25; padding-left: 4px">
        <span style="font-family: 'Shippori Mincho B1', Georgia, serif; font-size: 20px; font-weight: 800; color: #f3e9d6">Ashihira Senju</span>
        <span style="font-size: 12px; color: #b3a48c">NC 20 · Sannin/Kage · Senju</span>
      </div>

      <div style="display: flex; align-items: center; gap: 8px; padding: 4px 4px 4px 12px; border: 1px solid #3a3027; border-radius: 12px; background: #1b1612">
        <span style="display: flex; flex-direction: column; line-height: 1.25">
          <span style="max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #b3a48c">[NOME DA SALA]</span>
          <span style="font-family: 'Shippori Mincho B1', Georgia, serif; font-size: 16px; font-weight: 800; letter-spacing: 0.2em; color: #f3e9d6">[CÓDIGO]</span>
        </span>
        <button type="button" aria-label="Copiar código da sala" style="display: grid; place-items: center; width: 36px; height: 36px; border: 0; border-radius: 8px; background: #2a221a; color: #efe6d6">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V5a1 1 0 011-1h10"></path></svg>
        </button>
      </div>
      <span style="display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 99px; background: #2a221a; font-size: 14px; font-weight: 700">Rodada <span style="color: #f0892a">3</span></span>
      <button type="button" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border: 1px solid #3a3027; border-radius: 12px; background: transparent; color: #efe6d6; font-size: 14px; font-weight: 700">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"></path><path d="M4 9h10a6 6 0 010 12h-3"></path></svg>
        Desfazer
      </button>
    </div>

    <div style="max-width: 1280px; margin: 0 auto; display: flex; align-items: flex-end; gap: 24px; padding: 0 32px">
      <nav aria-label="Partes da mesa" style="display: flex; flex: 1">
        <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="5">
          <a href="#" aria-current="{{ t.current }}" style="position: relative; display: flex; align-items: center; height: 48px; padding: 0 16px; text-decoration: none; font-size: 14px; font-weight: 700; color: {{ t.color }}">
            {{ t.label }}
            <span style="position: absolute; left: 12px; right: 12px; bottom: 0; height: 3px; border-radius: 3px; background: {{ t.bar }}"></span>
          </a>
        </sc-for>
      </nav>
      <div style="width: 380px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; padding-bottom: 12px">
        <span style="display: flex; flex-direction: column; gap: 4px">
          <span style="display: flex; align-items: baseline; gap: 5px; line-height: 1"><span style="font-size: 10px; font-weight: 700; letter-spacing: 0.14em; color: #b3a48c">VIT</span><span style="font-family: 'Shippori Mincho B1', Georgia, serif; font-size: 17px; font-weight: 800; color: #ffd9cf">112</span><span style="font-size: 12px; color: #b3a48c">/ 134</span></span>
          <span style="display: block; height: 6px; border-radius: 6px; background: #3d1f18"><span style="display: block; height: 6px; width: 84%; border-radius: 6px; background: #e0573a"></span></span>
        </span>
        <span style="display: flex; flex-direction: column; gap: 4px">
          <span style="display: flex; align-items: baseline; gap: 5px; line-height: 1"><span style="font-size: 10px; font-weight: 700; letter-spacing: 0.14em; color: #b3a48c">CHAKRA</span><span style="font-family: 'Shippori Mincho B1', Georgia, serif; font-size: 17px; font-weight: 800; color: #d6e9fa">61</span><span style="font-size: 12px; color: #b3a48c">/ 90</span></span>
          <span style="display: block; height: 6px; border-radius: 6px; background: #1c3346"><span style="display: block; height: 6px; width: 68%; border-radius: 6px; background: #4f9bd9"></span></span>
        </span>
      </div>
    </div>
  </header>

  <sc-if value="{{ open }}" hint-placeholder-val="{{ true }}">
    <div role="dialog" aria-label="Retrato de Ashihira Senju" style="position: absolute; top: 76px; left: 144px; width: 272px; display: flex; flex-direction: column; gap: 12px; padding: 12px; border: 1px solid #3a3027; border-radius: 16px; background: #211b15; box-shadow: 0 18px 48px rgba(0,0,0,0.5)">
      <span style="display: block; width: 248px; height: 330px; border-radius: 10px; overflow: hidden">
        <svg viewBox="0 0 120 160" width="248" height="330" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="display: block"><rect width="120" height="160" fill="#2a221a"></rect><circle cx="92" cy="34" r="30" fill="#c2381b" opacity="0.45"></circle><path d="M6 160 C10 122 32 108 60 108 C88 108 110 122 114 160 Z" fill="#0f0c09"></path><path d="M46 104 L60 122 L74 104 Z" fill="#3a3027"></path><path d="M30 64 L26 40 L40 50 L44 28 L54 44 L62 24 L68 44 L80 30 L80 50 L94 42 L88 66 Z" fill="#0f0c09"></path><circle cx="60" cy="72" r="26" fill="#0f0c09"></circle><rect x="33" y="56" width="54" height="11" rx="2" fill="#5b4a36"></rect><rect x="49" y="57" width="22" height="9" rx="1.5" fill="#b3a48c"></rect><path d="M54 61.5 h12" stroke="#5b4a36" stroke-width="1.4"></path></svg>
      </span>
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 4px">
        <span style="display: flex; flex-direction: column; line-height: 1.3">
          <span style="font-family: 'Shippori Mincho B1', Georgia, serif; font-size: 17px; font-weight: 800; color: #f3e9d6">Ashihira Senju</span>
          <span style="font-size: 12px; color: #b3a48c">Senju · Konoha</span>
        </span>
        <a href="#" style="display: inline-flex; align-items: center; min-height: 36px; padding: 0 12px; border: 1px solid #3a3027; border-radius: 10px; font-size: 13px; font-weight: 700; text-decoration: none; color: #efe6d6">Ver ficha</a>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":620}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: true };
  }
  renderVals() {
    var labels = ['Ataques', 'Status', 'Estados', 'Combate', 'Números'];
    return {
      open: this.state.open,
      ring: this.state.open ? '#f0892a' : '#3a3027',
      toggle: () => this.setState({ open: !this.state.open }),
      tabs: labels.map((l, i) => ({
        label: l,
        current: i === 0 ? 'page' : 'false',
        color: i === 0 ? '#f3e9d6' : '#8f8170',
        bar: i === 0 ? '#f0892a' : 'transparent'
      }))
    };
  }
}
</script>
</body>
</html>
