<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Mesa · Retrato no celular</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#16120e}
a{color:#f0892a}a:hover{color:#ffd3a8}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #16120e; color: #efe6d6; font-family: 'Zen Kaku Gothic New', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="flex-shrink: 0; padding: 10px 16px 12px; border-bottom: 1px solid #2e261e; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 10px">
      <a href="#" aria-label="Voltar ao início" style="display: grid; place-items: center; width: 44px; height: 44px; flex-shrink: 0; border: 1px solid #3a3027; border-radius: 12px; color: #efe6d6">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
      </a>
      <button type="button" onClick="{{ show }}" aria-label="Ver retrato" style="position: relative; flex-shrink: 0; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 12px; background: #2a221a">
        <span style="display: block; width: 44px; height: 44px; border-radius: 12px; overflow: hidden">
          <svg viewBox="12 24 96 96" width="44" height="44" aria-hidden="true" style="display: block"><rect width="120" height="160" fill="#2a221a"></rect><circle cx="92" cy="34" r="30" fill="#c2381b" opacity="0.45"></circle><path d="M6 160 C10 122 32 108 60 108 C88 108 110 122 114 160 Z" fill="#0f0c09"></path><path d="M30 64 L26 40 L40 50 L44 28 L54 44 L62 24 L68 44 L80 30 L80 50 L94 42 L88 66 Z" fill="#0f0c09"></path><circle cx="60" cy="72" r="26" fill="#0f0c09"></circle><rect x="33" y="56" width="54" height="11" rx="2" fill="#5b4a36"></rect><rect x="49" y="57" width="22" height="9" rx="1.5" fill="#b3a48c"></rect></svg>
        </span>
        <span style="position: absolute; right: -5px; bottom: -5px; display: grid; place-items: center; width: 20px; height: 20px; border-radius: 99px; border: 2px solid #16120e; background: #c2381b; font-family: 'Shippori Mincho B1', Georgia, serif; font-size: 11px; font-weight: 800; color: #fff">千</span>
      </button>
      <div style="display: flex; flex-direction: column; flex: 1; min-width: 0">
        <span style="font-family: 'Shippori Mincho B1', Georgia, serif; font-weight: 800; font-size: 18px; color: #f3e9d6; line-height: 1.15">Ashihira Senju</span>
        <span style="font-size: 12px; color: #b3a48c">NC 20 · Sannin/Kage</span>
      </div>
      <span style="display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 99px; background: #2a221a; font-size: 13px; font-weight: 700">Rodada <span style="color: #f0892a">3</span></span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <span style="display: flex; flex-direction: column; gap: 4px">
        <span style="display: flex; align-items: baseline; gap: 5px; line-height: 1"><span style="font-size: 10px; font-weight: 700; letter-spacing: 0.14em; color: #b3a48c">VIT</span><span style="font-family: 'Shippori Mincho B1', Georgia, serif; font-size: 17px; font-weight: 800; color: #ffd9cf">112</span><span style="font-size: 12px; color: #b3a48c">/ 134</span></span>
        <span style="display: block; height: 6px; border-radius: 6px; background: #3d1f18"><span style="display: block; height: 6px; width: 84%; border-radius: 6px; background: #e0573a"></span></span>
      </span>
      <span style="display: flex; flex-direction: column; gap: 4px">
        <span style="display: flex; align-items: baseline; gap: 5px; line-height: 1"><span style="font-size: 10px; font-weight: 700; letter-spacing: 0.14em; color: #b3a48c">CHAKRA</span><span style="font-family: 'Shippori Mincho B1', Georgia, serif; font-size: 17px; font-weight: 800; color: #d6e9fa">61</span><span style="font-size: 12px; color: #b3a48c">/ 90</span></span>
        <span style="display: block; height: 6px; border-radius: 6px; background: #1c3346"><span style="display: block; height: 6px; width: 68%; border-radius: 6px; background: #4f9bd9"></span></span>
      </span>
    </div>
  </header>

  <main style="flex: 1; min-height: 0"></main>

  <nav aria-label="Partes da mesa" style="flex-shrink: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 4px 4px 10px; border-top: 1px solid #2e261e; background: #1b1612">
    <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="5">
      <a href="#" aria-current="{{ t.current }}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 54px; text-decoration: none; font-size: 11px; font-weight: 700; color: {{ t.color }}">
        <span style="width: 22px; height: 3px; border-radius: 3px; background: {{ t.bar }}"></span>
        {{ t.label }}
      </a>
    </sc-for>
  </nav>

  <sc-if value="{{ open }}" hint-placeholder-val="{{ true }}">
    <div style="position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; background: rgba(15,12,9,0.78)">
      <button type="button" onClick="{{ hide }}" aria-label="Fechar retrato" style="flex: 1; border: 0; background: transparent"></button>
      <div role="dialog" aria-label="Retrato de Ashihira Senju" style="display: flex; flex-direction: column; gap: 14px; padding: 10px 16px 20px; border-radius: 22px 22px 0 0; background: #211b15; border-top: 1px solid #3a3027">
        <span style="align-self: center; width: 40px; height: 4px; border-radius: 4px; background: #3a3027"></span>
        <span style="display: block; width: 358px; height: 440px; border-radius: 14px; overflow: hidden">
          <svg viewBox="0 0 120 160" width="358" height="440" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="display: block"><rect width="120" height="160" fill="#2a221a"></rect><circle cx="92" cy="34" r="30" fill="#c2381b" opacity="0.45"></circle><path d="M6 160 C10 122 32 108 60 108 C88 108 110 122 114 160 Z" fill="#0f0c09"></path><path d="M46 104 L60 122 L74 104 Z" fill="#3a3027"></path><path d="M30 64 L26 40 L40 50 L44 28 L54 44 L62 24 L68 44 L80 30 L80 50 L94 42 L88 66 Z" fill="#0f0c09"></path><circle cx="60" cy="72" r="26" fill="#0f0c09"></circle><rect x="33" y="56" width="54" height="11" rx="2" fill="#5b4a36"></rect><rect x="49" y="57" width="22" height="9" rx="1.5" fill="#b3a48c"></rect><path d="M54 61.5 h12" stroke="#5b4a36" stroke-width="1.4"></path></svg>
        </span>
        <div style="display: flex; align-items: center; gap: 12px">
          <span style="display: flex; flex-direction: column; flex: 1; line-height: 1.3">
            <span style="font-family: 'Shippori Mincho B1', Georgia, serif; font-size: 20px; font-weight: 800; color: #f3e9d6">Ashihira Senju</span>
            <span style="font-size: 13px; color: #b3a48c">Senju · Konoha · NC 20</span>
          </span>
          <button type="button" onClick="{{ hide }}" style="min-height: 44px; padding: 0 18px; border: 1px solid #3a3027; border-radius: 12px; background: transparent; color: #efe6d6; font-size: 14px; font-weight: 700">Fechar</button>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: true };
  }
  renderVals() {
    var labels = ['Ataques', 'Status', 'Estados', 'Números', 'Mais'];
    return {
      open: this.state.open,
      show: () => this.setState({ open: true }),
      hide: () => this.setState({ open: false }),
      tabs: labels.map((l, i) => ({
        label: l,
        current: i === 0 ? 'page' : 'false',
        color: i === 0 ? '#f3e9d6' : '#8f8170',
        bar: i === 0 ? '#f0892a' : 'transparent'
      }))
    };
  }
}
</script>
</body>
</html>
